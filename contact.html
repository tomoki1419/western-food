<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="css/cont.css/contact.css">
    <title>お問い合わせフォーム</title>
</head>
<body>
    <header>
        <h1>
            <img src="images/おためしロゴ.jpg" class="logo">
            <span data-translate-key="shop_name">店舗名</span>
        </h1>
        <nav>
            <ul>
                <li><a href="index.html" data-translate-key="home">ホーム</a></li>
                <li><a href="allmenu.html" data-translate-key="menu">メニュー</a></li>
                <li><a href="shopinfo.html" data-translate-key="shopinfo">店舗情報</a></li>
            </ul>
        </nav>

        <div class="hamburger-menu" id="hamburger-btn">
             <span></span>
             <span></span>
             <span></span>
        </div>
    </header>
    <main>
        <section class="contact-section">
            <h2 class="section-title">お問い合わせフォーム</h2>
            <p class="section-text">ご質問やご意見がございましたら、以下のフォームにご記入の上、送信してください。できるだけ早く対応させていただきます。</p>
        </section>

    <div class="Form">
       <div class="Form-Item">
    <p class="Form-Item-Label"><span class="Form-Item-Label-Required">氏名</p>
    <input type="text" class="Form-Item-Input" placeholder="例）山田太郎">
  </div>

  <div class="Form-Item">
    <p class="Form-Item-Label"><span class="Form-Item-Label-Required">電話番号</p>
    <input type="text" class="Form-Item-Input" placeholder="例）000-0000-0000">
  </div>

  <div class="Form-Item">
    <p class="Form-Item-Label"><span class="Form-Item-Label-Required">メールアドレス</p>
    <input type="email" class="Form-Item-Input" placeholder="例）example@gmail.com">
  </div>

  <div class="Form-Item">
    <p class="Form-Item-Label isMsg"><span class="Form-Item-Label-Required">お問い合わせ内容</p>
    <textarea class="Form-Item-Textarea"></textarea>
  </div>
  <input type="submit" class="Form-Btn" value="送信する">
</div>
    </div>

<footer>
    <p data-translate-key="address">住所: 〒000-0000 東京都〇〇区〇〇1-2-3 〇〇ビル1F</p>
    <p data-translate-key="contact_info">ご予約・お問い合わせ: <a href="tel:0000000000">000-0000-0000</a></p>
    <p data-translate-key="copyright">&copy; [2025] [店舗名またはあなたの名前] All Rights Reserved.</p>
</footer>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const hamburger = document.querySelector('.hamburger-menu');
        const nav = document.querySelector('header nav');

        hamburger.addEventListener('click', function() {
            this.classList.toggle('open');
            nav.classList.toggle('open');
        });
    });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="js/index.js"></script>
</body>
</html>
